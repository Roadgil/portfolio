<style>
  :root{
    --brand:#1d4d4f; --brand-light:#e8f0ee; --line:#e3e3e3; --sub:#777;
    --bg:#f6f7f7; --card:#fff; --danger:#c0392b; --ok:#2e7d32;
  }
  *{box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background:var(--bg); margin:0; padding:24px 14px; color:#222;
  }
  .wrap{max-width:720px; margin:0 auto}
  h1{font-size:20px; margin:0 0 4px}
  .sub{color:var(--sub); font-size:13px; margin:0 0 20px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px}
  label{display:block; font-size:13px; font-weight:600; margin:14px 0 6px}
  label:first-child{margin-top:0}
  input[type=text], input[type=number], textarea{
    width:100%; padding:11px 12px; border:1px solid #ccc; border-radius:9px;
    font:inherit; font-size:14.5px;
  }
  textarea{min-height:80px; resize:vertical}
  .btn{
    background:var(--brand); color:#fff; border:none; border-radius:9px;
    padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer;
  }
  .btn:hover{opacity:.92}
  .btn.secondary{background:#eee; color:#333}
  .autocomplete{position:relative}
  .dd{
    position:absolute; left:0; right:0; top:calc(100% + 4px); background:#fff;
    border:1px solid var(--line); border-radius:10px; max-height:260px; overflow:auto;
    box-shadow:0 6px 18px rgba(0,0,0,.08); z-index:20; display:none;
  }
  .dd.show{display:block}
  .dd .hi{padding:10px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0}
  .dd .hi:hover, .dd .hi.active{background:var(--brand-light)}
  .dd .pn{font-weight:600; font-size:14px}
  .dd .ad{font-size:12px; color:var(--sub); margin-top:2px}
  .dd .msg{padding:12px; font-size:12.5px; color:var(--sub)}
  .msg-ok{background:#eef7ee; border:1px solid #cfe8cf; color:var(--ok); padding:12px 14px; border-radius:10px; font-size:14px}
  .msg-err{background:#fdeceb; border:1px solid #f3c6c1; color:var(--danger); padding:12px 14px; border-radius:10px; font-size:14px}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th, td{border-bottom:1px solid var(--line); padding:9px 8px; text-align:left; vertical-align:top}
  th{background:var(--brand-light); font-size:12.5px}
  select{font:inherit; padding:6px 8px; border-radius:7px; border:1px solid #ccc}
  .tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11.5px; font-weight:700}
  .tag.접수됨{background:#fff4e0; color:#9a6b1c}
  .tag.주소확인필요{background:#fdeceb; color:var(--danger)}
  .tag.택배발송완료{background:#eef7ee; color:var(--ok)}
</style>
